[project]
name = "mathx-skills"
version = "0.4.0"
description = "MathX math-modeling skills — 35 skills with gate scripts"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
full = [
  "pandas>=2.0", "openpyxl>=3.1", "numpy>=1.26", "scipy>=1.12",
  "scikit-learn>=1.4", "statsmodels>=0.14", "networkx>=3.2", "pulp>=2.8",
  "matplotlib>=3.8", "seaborn>=0.13", "plotly>=5.18", "sympy>=1.12",
  "pypdf>=4.0", "python-docx>=1.1", "python-pptx>=0.6",
  "opencv-python>=4.9", "Pillow>=10.0", "pyyaml>=6.0"
]

[tool.ruff]
target-version = "py310"
